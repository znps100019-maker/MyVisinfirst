name: Gesture Recognition CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxrender1 libxext6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mediapipe==0.10.14
          pip install -r requirements.txt

      - name: Run syntax check
        run: |
          python -m py_compile main.py hand_detector.py face_detector.py arm_detector.py

      - name: Run accuracy test
        run: |
          python test_accuracy.py
        timeout-minutes: 10

      - name: Run comprehensive test
        run: |
          python comprehensive_test.py
        timeout-minutes: 15

      - name: Run dashboard creation
        run: |
          python create_dashboard.py
        timeout-minutes: 10

      - name: Upload dashboard screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: dashboard_frame_*.jpg
          retention-days: 7
