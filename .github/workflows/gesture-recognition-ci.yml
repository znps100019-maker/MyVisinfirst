name: Gesture Recognition CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # 每週日午夜運行

jobs:
  syntax-check:
    name: Python 語法檢查
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Check syntax
      run: |
        python -m py_compile main.py hand_detector.py face_detector.py arm_detector.py
        echo "✓ 語法檢查通過"

  accuracy-test:
    name: 手勢辨識準確度測試
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxrender1 libxext6
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mediapipe==0.10.14
        pip install -r requirements.txt
    
    - name: Run accuracy test
      run: |
        python test_accuracy.py
      timeout-minutes: 10

  comprehensive-test:
    name: 綜合測試（多影片）
    runs-on: ubuntu-latest
    needs: accuracy-test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxrender1 libxext6
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mediapipe==0.10.14
        pip install -r requirements.txt
    
    - name: Run comprehensive test
      run: |
        python comprehensive_test.py
      timeout-minutes: 15

  dashboard-test:
    name: 儀表板建立測試
    runs-on: ubuntu-latest
    needs: accuracy-test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxrender1 libxext6
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mediapipe==0.10.14
        pip install -r requirements.txt
    
    - name: Run dashboard creation
      run: |
        python create_dashboard.py
      timeout-minutes: 10
    
    - name: Upload dashboard screenshots
      uses: actions/upload-artifact@v3
      with:
        name: dashboard-screenshots
        path: dashboard_frame_*.jpg
        retention-days: 7

  performance-benchmark:
    name: 效能基準測試
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxrender1 libxext6
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mediapipe==0.10.14
        pip install -r requirements.txt
    
    - name: Run performance benchmark
      run: |
        python -c "
import time
import cv2
from hand_detector import HandSignRecognizer

# 測試初始化時間
start = time.time()
recognizer = HandSignRecognizer()
init_time = time.time() - start
print(f'初始化時間: {init_time:.2f} 秒')

# 測試處理速度
cap = cv2.VideoCapture('sign_language_app/raw_videos_backup/deaf/手語新手教室 第九課：購物、時態｜手語方向｜手語練習環節｜香港手語｜WeTV x 聾場蜜語 [rVdnKYFpQSg].mp4')
frames_processed = 0
start = time.time()

for _ in range(30):
    success, img = cap.read()
    if not success:
        break
    img = cv2.flip(img, 1)
    recognizer.process(img)
    frames_processed += 1

process_time = time.time() - start
fps = frames_processed / process_time if process_time > 0 else 0
print(f'處理速度: {fps:.2f} FPS')
print(f'平均每幀處理時間: {process_time/frames_processed*1000:.1f} ms')

cap.release()
recognizer.close()
"
      timeout-minutes: 10
