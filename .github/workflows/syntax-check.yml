name: Syntax Check

on:
  pull_request:
  push:

jobs:
  python-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check syntax
        run: python -m compileall -q main.py arm_detector.py hand_detector.py
